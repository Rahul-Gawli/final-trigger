name: Trigger All Repositories

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  generate-token:
    name: Generate GitHub App Token
    runs-on: ubuntu-latest

    outputs:
      token: ${{ steps.app-token.outputs.token }}

    steps:

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: EnterprisePortal


  trigger-repo-1:
    name: Trigger Repo 1
    needs: generate-token
    runs-on: ubuntu-latest

    steps:

      - name: Trigger Repo 1 Workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ needs.generate-token.outputs.token }}

          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'EnterprisePortal',
              repo: 'Repo-1',
              workflow_id: 'build.yml',
              ref: 'main'
            });

            console.log('Repo-1 workflow triggered successfully');


  trigger-repo-2:
    name: Trigger Repo 2
    needs: generate-token
    runs-on: ubuntu-latest

    steps:

      - name: Trigger Repo 2 Workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ needs.generate-token.outputs.token }}

          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'EnterprisePortal',
              repo: 'Repo-2',
              workflow_id: 'build.yml',
              ref: 'main'
            });

            console.log('Repo-2 workflow triggered successfully');
