name: Trigger All Repositories

on:
  workflow_dispatch:

jobs:

  trigger-repo-1:
    name: Trigger Repo 1
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Repo 1 Workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'YOUR_ORG',
              repo: 'Repo-1',
              workflow_id: 'build.yml',
              ref: 'main'
            });

            console.log('Repo-1 workflow triggered');


  trigger-repo-2:
    name: Trigger Repo 2
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Repo 2 Workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'YOUR_ORG',
              repo: 'Repo-2',
              workflow_id: 'build.yml',
              ref: 'main'
            });

            console.log('Repo-2 workflow triggered');
